[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kagecatch"
version = "0.1.0"
description = "Multi-user Telegram character catch orchestration core"
requires-python = ">=3.11"
dependencies = ["cryptography>=42,<47"]

[project.optional-dependencies]
telegram = ["telethon>=1.36,<2"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "telethon>=1.36,<2"]
test = []

[tool.setuptools.packages.find]
include = ["kagecatch*"]
