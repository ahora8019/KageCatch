[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kagecatch"
version = "0.1.0"
description = "Multi-user Telegram character catch orchestration core"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
telegram = ["telethon>=1.36,<2"]
test = []

[tool.setuptools.packages.find]
include = ["kagecatch*"]
