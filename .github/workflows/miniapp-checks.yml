name: KageCatch Mini App Checks

on:
  push:
    branches:
      - feat/pro-dashboard-mini-app
  pull_request:
    branches:
      - main
      - feat/catch-engine-foundation

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package and Telegram runtime
        run: python -m pip install -e ".[telegram,api]"
      - name: Run Python Core tests
        run: python -m unittest discover -s tests -v
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Control Worker tests
        run: node --test worker/index.test.mjs
