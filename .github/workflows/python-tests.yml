name: Python Core Tests

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and Telegram runtime
        run: python -m pip install '.[telegram]'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
