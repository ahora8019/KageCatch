name: Worker tests

on:
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test worker/test/*.test.js
