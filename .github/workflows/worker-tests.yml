name: Worker tests

on:
  push:
    branches:
      - main
      - feat/native-telegram-login
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Worker test suite
        run: node --test worker/index.test.mjs
