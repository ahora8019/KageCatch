name: KageCatch CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and API dependencies
        run: python -m pip install -e ".[api]"
      - name: Run Python test suite
        run: python -m unittest discover -s tests -v

  worker:
    name: Cloudflare Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Worker tests
        run: node --test worker/index.test.mjs
