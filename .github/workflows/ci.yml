name: KageCatch CI

on:
  pull_request:

# Keep only the newest run for this PR/branch. Older queued runs are waste.
concurrency:
  group: kagecatch-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and API dependencies
        run: python -m pip install -e ".[api]"
      - name: Run Python test suite
        run: python -m unittest discover -s tests -v

  worker:
    name: Cloudflare Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Worker tests
        run: node --test worker/index.test.mjs
